# Render Blueprint: one web service + one Postgres. Deploy via Dashboard > New > Blueprint.
# FREE plans (no card on file). Trade-offs: the web service sleeps after 15 min idle
# (~1 min cold start), and free Postgres expires 30 days after creation. Upgrade both
# (web 0.5c-512mb, db 0.1c-256mb) before judging if possible.
services:
  - type: web
    name: leash
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    # Free services have no preDeployCommand: migrations (idempotent) run at startup.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    # Deploy only after GitHub Actions (typecheck, lint, tests, build) pass on main.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: MAX_RUNS_PER_WORKSPACE
        value: "15"
      # auto: any integration without keys runs as a labelled offline simulator.
      # off: integrations without keys are disabled (503). Never affects configured integrations.
      - key: DEMO_MODE
        value: auto
      # APP_URL is optional: Render provides RENDER_EXTERNAL_URL, which Leash uses for PayPal redirects.

databases:
  - name: leash-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: leash
    user: leash
    # No public access: only services in this Render workspace can connect.
    ipAllowList: []
