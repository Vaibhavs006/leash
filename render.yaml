# Render Blueprint: one web service + one Postgres. Deploy via Dashboard > New > Blueprint.
# Paid plans are deliberate: no cold starts for judges, and the database won't expire
# before judging ends (free Postgres expires after 30 days). Covered by hackathon credits.
services:
  - type: web
    name: leash
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    # Let in-flight agent runs (Next.js after() callbacks) finish during deploys.
    maxShutdownDelaySeconds: 60
    # Deploy only after GitHub Actions (typecheck, lint, tests, build) pass on main.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: MAX_RUNS_PER_WORKSPACE
        value: "15"
      # auto: any integration without keys runs as a labelled offline simulator.
      # off: integrations without keys are disabled (503). Never affects configured integrations.
      - key: DEMO_MODE
        value: auto
      # APP_URL is optional: Render provides RENDER_EXTERNAL_URL, which Leash uses for PayPal redirects.

databases:
  - name: leash-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: leash
    user: leash
    # No public access: only services in this Render workspace can connect.
    ipAllowList: []
