name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leash
          POSTGRES_PASSWORD: leash
          POSTGRES_DB: leash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leash" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://leash:leash@localhost:5432/leash_test
      DATABASE_URL: postgres://leash:leash@localhost:5432/leash_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:int
      - run: npm run build
      # Production server + HTTP smoke test (offline demo mode: no secrets in CI).
      - run: npm run db:migrate
      - name: Smoke test production build
        run: |
          PORT=3000 npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health > /dev/null && break; sleep 1; done
          npm run smoke -- http://localhost:3000 || (cat server.log; exit 1)
